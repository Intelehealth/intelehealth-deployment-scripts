# MyBatis environment ID — must match an <environment id="..."> in db_properties.xml
MybatisEnvironmentId=intelehealthAwsTest

# Base URL of this middleware server (used for internal links / callbacks)
serverhost=http://localhost

# Internal Tomcat port — keep at 8080; docker-compose maps it to 8999 externally
port=8080

# Port for the mindmap/companion service
mindmapPort=3004

# Swagger UI host (public IP or hostname visible to API consumers)
swaggerhost=http://localhost

# Treblle API monitoring (leave blank to disable)
treblle.apiKey=
treblle.projectId=
